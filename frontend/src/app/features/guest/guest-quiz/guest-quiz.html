<main class="guest-quiz-page">
  <section class="guest-quiz-card">
    <h1>Guest Quiz</h1>

    <p class="subtitle">
      Try a quick Mandarin quiz without creating an account.
    </p>

    <p class="guest-info">
      Your guest session is temporary. Create an account when you're
      ready to save your learning progress.
    </p>

    <button type="button" class="start-button">
      Start Quiz
    </button>

    <p class="account-link">
      Want to save your progress?
      <a routerLink="/register">Create an account</a>
    </p>

    <p class="login-link">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

    <a routerLink="/" class="home-link">
      Back to Home
    </a>
  </section>
</main>
